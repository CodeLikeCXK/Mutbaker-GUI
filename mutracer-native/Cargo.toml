[package]
name = "mutracer-native"
version = "0.1.0"
edition = "2024"

[lib]
name = "mutracer_native"
path = "src/lib.rs"

[[bin]]
name = "mutracer-native"
path = "src/main.rs"

[dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["dx12", "wgsl"] }
glam = "0.33.12"
bytemuck = { version = "1.25.2", features = ["derive"] }
anyhow = "1.0.100"
gltf = { version = "1.4.1", features = [
    "KHR_materials_emissive_strength",
    "KHR_lights_punctual",
    "KHR_texture_transform",
    "KHR_materials_unlit",
    "KHR_materials_ior",
    "KHR_materials_specular",
    "KHR_materials_transmission",
    "KHR_materials_volume",
    "names",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
half = "2.7.1"
ktx2 = "0.5.0"
