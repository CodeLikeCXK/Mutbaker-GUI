[package]
name = "mutbaker-gui"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { path = "C:/Bevy", default-features = false, features = [
    "bevy_winit",
    "bevy_render",
    "bevy_pbr",
    "bevy_gltf",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_text",
    "default_font",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "bevy_core_pipeline",
    "bevy_image",
    "bevy_asset",
    "bevy_camera",
    "bevy_scene",
    "bevy_picking",
    "ui_picking",
    "reflect_auto_register",
    "bevy_light",
    "x11",
] }
muttracer-native = { path = "../muttracer-native" }
glam = "0.33.12"
anyhow = "1.0.100"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
bytemuck = { version = "1.25.2", features = ["derive"] }
ktx2 = "0.5.0"
